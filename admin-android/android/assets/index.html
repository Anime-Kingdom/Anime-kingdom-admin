<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: blob:; connect-src https://iuftepknrbankwkfdbuc.supabase.co; base-uri 'none'; form-action 'none'"><title>Anime Kingdom Admin</title><link rel="stylesheet" href="style.css"></head><body><section id="gateway" class="gateway"><div class="gateway-card"><img class="gateway-logo-image" src="logo.jpeg" alt="Anime Kingdom" width="272" height="272"><p class="gateway-eyebrow">COVENANT CORE TERMINAL</p><h1>ADMIN GATEWAY</h1><form id="gateway-form"><label for="admin-identifier">ADMIN IDENTIFIER</label><input id="admin-identifier" name="username" autocomplete="username" placeholder="Enter admin identifier" required maxlength="80"><label for="admin-passcode">ACCESS PASSCODE</label><div class="passcode-field"><input id="admin-passcode" name="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required><button id="toggle-passcode" type="button" aria-label="Show passcode" aria-pressed="false">Show</button></div><button id="gateway-submit" type="submit">ESTABLISH COVENANT CONNECTION</button><p id="gateway-status" role="status" aria-live="polite"></p></form><a class="gateway-return" href="https://www.animekingdom.in/">← RETURN TO ANIME KINGDOM</a></div></section><div id="admin-shell" hidden><header><small>ANIME KINGDOM</small><h1>Store command center</h1><p>Your catalog, orders and offers — together in one place.</p></header><main><div class="connection"><span id="connection-label">Store preview</span><button id="disconnect" hidden>Disconnect device</button></div><section id="workspace"><nav><button data-tab="dashboard">◈ Analytics dashboard</button><button data-tab="products">▦ Product catalog</button><button data-tab="orders">▣ Order dispatch</button><button data-tab="coupons">◇ Coupons</button><button data-tab="customers">♙ Customers</button><button data-tab="inventory">▤ Stock &amp; inventory</button></nav><div class="toolbar"><h2 id="heading">Products</h2><button id="refresh">Refresh</button><button id="add">+ Product</button></div><div class="filter-bar"><label class="search-label">Search your store<input id="search" placeholder="Search by product, customer or order" aria-label="Search"></label><label>Show<select id="filter"><option value="all">All items</option></select></label><label>Sort by<select id="sort"><option value="default">Default order</option><option value="name">Name A–Z</option><option value="price-low">Price low to high</option><option value="price-high">Price high to low</option><option value="stock">Lowest stock</option></select></label></div><p id="result-count" class="result-count" aria-live="polite"></p><div id="list"></div><button id="more" hidden>Load more</button></section><p id="status" role="status" aria-live="polite"></p></main><dialog id="editor"><form id="product"><h2>Edit product</h2><label>Name<input name="name" required maxlength="200"></label><label>Collection<input name="anime" required maxlength="100"></label><label>Category<input name="category" required maxlength="100"></label><div class="columns"><label>Original price ₹ (optional)<input name="original" type="number" min="0.01" step="0.01"></label><label>Selling / discounted price ₹<input name="price" type="number" min="1" step="0.01" required></label><label>Stock<input name="stock" type="number" min="0" step="1" required></label></div><label>Description<textarea name="description" rows="5" maxlength="4000"></textarea></label><label>Photos<input id="upload" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="photos"></div><label><input name="featured" type="checkbox"> Featured on home page</label><button id="save">Save to website catalog</button><button type="button" id="cancel" class="secondary">Cancel</button><p id="edit-status" role="status"></p></form></dialog><dialog id="coupon-editor"><form id="coupon-form"><h2>Edit coupon</h2><label>Code<input name="code" pattern="[A-Za-z0-9_-]{3,40}" required></label><label>Discount type<select name="kind"><option value="percent">Percentage</option><option value="amount">Fixed amount ₹</option></select></label><label>Discount value<input name="value" type="number" min="0.01" step="0.01" required></label><label>Minimum order ₹<input name="minimum" type="number" min="0" step="0.01" required></label><label><input name="enabled" type="checkbox"> Enabled</label><p>Coupons retain the website's one-use-per-browser rule.</p><button id="coupon-save">Save coupon</button><button type="button" id="coupon-cancel" class="secondary">Cancel</button><p id="coupon-status" role="status"></p></form></dialog></div><script src="app.js"></script></body></html>
